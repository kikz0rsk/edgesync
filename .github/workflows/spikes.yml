name: spikes

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - run: go -C spikes vet ./...
      - run: go -C spikes build ./...
      - run: go -C spikes test -tags integration ./...
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: spikes-windows
          path: spikes/out/**

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - run: go -C spikes vet ./...
      - run: go -C spikes build ./...
      - run: go -C spikes test -tags integration ./...
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: spikes-macos
          path: spikes/out/**

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Install X11 test tools
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils xdotool
      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 3840x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.3'
      - run: go -C spikes vet ./...
      - run: go -C spikes build ./...
      - run: go -C spikes test -tags integration ./...
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: spikes-linux
          path: spikes/out/**
